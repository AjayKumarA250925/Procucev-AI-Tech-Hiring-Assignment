# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Creates a managed PostgreSQL database and the web service.
databases:
  - name: stt-db
    plan: free
    databaseName: stt
    user: stt

services:
  - type: web
    name: speech-to-text
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stt-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false          # set it in the Render dashboard
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.5-transcribe-live
      # Free plan = 512 MB RAM and a fraction of a CPU. Measured: Piper with one
      # voice loaded at a time uses ~220 MB. Whisper is too slow on this CPU, so
      # speech recognition uses Gemini here; set WHISPER_ENABLED=true (and
      # WHISPER_MODEL=small) on a bigger plan to enable the self-hosted engine.
      - key: WHISPER_ENABLED
        value: "false"
      - key: WHISPER_MODEL
        value: none           # also skips baking the model into the image
      - key: PIPER_PRELOAD
        value: "false"
      - key: PIPER_MAX_LOADED
        value: "1"
