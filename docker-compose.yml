# One command local stack: PostgreSQL + the app.
#   GEMINI_API_KEY=your-key docker compose up --build
#   open http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stt
      POSTGRES_PASSWORD: stt
      POSTGRES_DB: stt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stt"]
      interval: 3s
      retries: 20

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://stt:stt@db:5432/stt
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.5-transcribe-live}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
